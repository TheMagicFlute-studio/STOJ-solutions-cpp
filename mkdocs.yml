# Project Information
site_name: STOJ新老题解库
site_description: STOJ新老题解库，提供STOJ的题解，欢迎各位前来学习和交流。
site_author: TheMagicFlute
site_url: https://TheMagicFlute.github.io/STOJ-solutions-cpp/
strict: true

